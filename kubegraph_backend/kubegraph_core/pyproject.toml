[project]
name = "kubegraph"
version = "0.1.0"
description = "Graph-theoretic identification and remediation of Kubernetes privilege-escalation paths"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
fast = ["rustworkx>=0.14"]  # optional accelerator for the scalability work

[project.scripts]
kubegraph = "kubegraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
