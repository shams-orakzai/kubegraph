[project]
name = "kubegraph"
version = "0.2.0"
description = "Graph-theoretic identification and remediation of Kubernetes privilege-escalation paths"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "kubernetes>=29.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "passlib>=1.7.4",
    "pyjwt>=2.8",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2"]
fast = ["rustworkx>=0.14"]

[project.scripts]
kubegraph = "kubegraph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
